name: Build EXE

on:
  # Запуск при создании тега
  push:
    tags:
      - 'v*'
  
  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например: v1.0.0)'
        required: true
        default: 'v1.0.0'

# Права для создания релиза
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install opencv-python numpy Pillow pdf2image
          pip install easyocr
          pip install rapidocr-onnxruntime
          pip install camelot-py[cv]
          pip install pytesseract
      
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --console --name DocumentOCR document_processor.py
      
      - name: Upload artifact (для проверки)
        uses: actions/upload-artifact@v4
        with:
          name: DocumentOCR-exe
          path: dist/DocumentOCR.exe
          retention-days: 7
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DocumentOCR.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
